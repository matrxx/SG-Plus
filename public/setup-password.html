<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#AA202D" />
  <title>Configurer le mot de passe — Services internes C2RMF</title>
  <link rel="icon" type="image/png" href="/favicon.png">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div class="simple-page">
    <header class="simple-header">
      <div class="simple-header-inner">
        <div class="brand">
          <img class="brand-logo" src="/logo-96.png" width="44" height="44" alt="">
          <div class="brand-text">
            <span class="brand-name">C2RMF</span>
            <span class="brand-org">Services internes</span>
          </div>
        </div>
      </div>
    </header>
    <main class="simple-wrap">
      <div class="simple-card">
        <h1 class="card-title">Configurer votre mot de passe</h1>
        <p class="card-sub">Vous avez été ajouté en tant que valideur. Définissez votre mot de passe pour commencer.</p>
        <div id="message" class="alert" role="alert" style="display: none;"></div>
        <form id="setupForm">
          <div class="form-group">
            <label class="form-label" for="password">Nouveau mot de passe</label>
            <input type="password" id="password" class="form-input" autocomplete="new-password" placeholder="Au moins 8 caractères" required minlength="8" />
          </div>
          <div class="form-group">
            <label class="form-label" for="confirmPassword">Confirmer le mot de passe</label>
            <input type="password" id="confirmPassword" class="form-input" autocomplete="new-password" placeholder="Confirmez votre mot de passe" required />
          </div>
          <button type="submit" class="btn btn-primary" id="submitBtn">Configurer le mot de passe</button>
        </form>
        <div class="center-row">
          <a href="/" class="link">Retour à l'accueil</a>
        </div>
      </div>
    </main>
    <footer class="app-footer"><span>Nestor-C2 — Services internes du C2RMF</span></footer>
  </div>

  <script src="setup-password.js"></script>
</body>
</html>
