<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Réinitialiser le mot de passe — Portail Services Internes</title>
  <style>
    :root {
      --bg-primary: #ffffff;
      --bg-secondary: #f4f3f8;
      --border-tertiary: #e3e1ee;
      --border-secondary: #cfcbe2;
      --text-primary: #1f1b3d;
      --text-secondary: #5c5775;
      --text-tertiary: #918ca8;
      --radius-md: 8px;
      --radius-lg: 14px;
      --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: var(--font-sans); color: var(--text-primary); background: var(--bg-secondary); }
    .hero { background: #26215c; padding: 24px 32px; text-align: center; }
    .hero-title { font-size: 22px; font-weight: 500; color: white; margin-bottom: 4px; }
    .hero-sub { font-size: 13px; color: #cecbf6; }
    .wrap { display: flex; justify-content: center; padding: 60px 24px; min-height: calc(100vh - 100px); align-items: flex-start; }
    .card { background: white; border-radius: var(--radius-lg); padding: 40px; width: 100%; max-width: 400px; box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08); }
    .card-title { font-size: 20px; font-weight: 600; margin-bottom: 8px; color: var(--text-primary); }
    .card-sub { font-size: 14px; color: var(--text-secondary); margin-bottom: 24px; }
    .form-group { margin-bottom: 20px; }
    .form-label { display: block; font-size: 14px; font-weight: 500; color: var(--text-primary); margin-bottom: 6px; }
    .form-input { width: 100%; padding: 12px 14px; border: 1px solid var(--border-secondary); border-radius: var(--radius-md); font-size: 15px; transition: border-color 0.2s; }
    .form-input:focus { outline: none; border-color: #6b66f2; }
    .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; width: 100%; padding: 12px 16px; border: none; border-radius: var(--radius-md); font-size: 15px; font-weight: 500; cursor: pointer; transition: background-color 0.2s; }
    .btn-primary { background: #6b66f2; color: white; }
    .btn-primary:hover { background: #5a56d4; }
    .btn:disabled { opacity: 0.6; cursor: not-allowed; }
    .alert { padding: 12px 14px; border-radius: var(--radius-md); margin-bottom: 20px; font-size: 14px; }
    .alert-error { background: #fef2f2; color: #dc2626; border: 1px solid #fecaca; }
    .alert-success { background: #f0fdf4; color: #16a34a; border: 1px solid #bbf7d0; }
    .link { color: #6b66f2; text-decoration: none; font-size: 14px; }
    .link:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="hero">
    <div class="hero-title">Portail Services Internes</div>
    <div class="hero-sub">Réinitialisation du mot de passe</div>
  </div>
  <div class="wrap">
    <div class="card">
      <div class="card-title">Réinitialiser votre mot de passe</div>
      <div class="card-sub">Saisissez votre nouveau mot de passe ci-dessous.</div>
      <div id="message" class="alert" style="display: none;"></div>
      <form id="resetForm">
        <div class="form-group">
          <label class="form-label" for="password">Nouveau mot de passe</label>
          <input type="password" id="password" class="form-input" placeholder="Au moins 8 caractères" required minlength="8" />
        </div>
        <div class="form-group">
          <label class="form-label" for="confirmPassword">Confirmer le mot de passe</label>
          <input type="password" id="confirmPassword" class="form-input" placeholder="Confirmez votre mot de passe" required />
        </div>
        <button type="submit" class="btn btn-primary" id="submitBtn">Réinitialiser le mot de passe</button>
      </form>
      <div style="margin-top: 20px; text-align: center;">
        <a href="/" class="link">Retour à l'accueil</a>
      </div>
    </div>
  </div>

  <script>
    // Récupérer le token depuis l'URL
    const urlParams = new URLSearchParams(window.location.search);
    const token = urlParams.get('token');

    if (!token) {
      document.getElementById('message').textContent = 'Token manquant. Veuillez vérifier le lien.';
      document.getElementById('message').className = 'alert alert-error';
      document.getElementById('message').style.display = 'block';
      document.getElementById('resetForm').style.display = 'none';
    }

    document.getElementById('resetForm').addEventListener('submit', async (e) => {
      e.preventDefault();

      const password = document.getElementById('password').value;
      const confirmPassword = document.getElementById('confirmPassword').value;
      const submitBtn = document.getElementById('submitBtn');
      const messageEl = document.getElementById('message');

      if (password !== confirmPassword) {
        messageEl.textContent = 'Les mots de passe ne correspondent pas.';
        messageEl.className = 'alert alert-error';
        messageEl.style.display = 'block';
        return;
      }

      submitBtn.disabled = true;
      submitBtn.textContent = 'En cours...';

      try {
        const response = await fetch('/api/auth/reset-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ token, password }),
        });

        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.error || 'Une erreur est survenue.');
        }

        messageEl.textContent = data.message || 'Votre mot de passe a été réinitialisé avec succès.';
        messageEl.className = 'alert alert-success';
        messageEl.style.display = 'block';
        document.getElementById('resetForm').style.display = 'none';

        // Rediriger après 3 secondes
        setTimeout(() => {
          window.location.href = '/';
        }, 3000);
      } catch (err) {
        messageEl.textContent = err.message;
        messageEl.className = 'alert alert-error';
        messageEl.style.display = 'block';
        submitBtn.disabled = false;
        submitBtn.textContent = 'Réinitialiser le mot de passe';
      }
    });
  </script>
</body>
</html>
